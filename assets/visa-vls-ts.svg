<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" role="img" aria-labelledby="t">
  <title id="t">Visa long séjour (VLS-TS)</title>
  <!-- Vignette visa simplifiée et anonyme : drapeau européen, mention VISA / FRANCE, silhouette, lignes de texte, pastille, signature et tampon décoratifs -->
  <defs>
    <!-- Fond dégradé comme une vraie vignette : vert pâle, jaune, rose au centre, puis vert-bleu -->
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#C9E4BA"/>
      <stop offset=".3" stop-color="#F6E98F"/>
      <stop offset=".52" stop-color="#F2CFC8"/>
      <stop offset=".75" stop-color="#D8EDBF"/>
      <stop offset="1" stop-color="#B5D9CB"/>
    </linearGradient>
    <!-- Reflets irisés de la pastille -->
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E27C"/>
      <stop offset=".35" stop-color="#F3B9C9"/>
      <stop offset=".65" stop-color="#9FD3E8"/>
      <stop offset="1" stop-color="#B9E3A6"/>
    </linearGradient>
    <clipPath id="carte"><rect x="1" y="1" width="94" height="62" rx="5"/></clipPath>
  </defs>
  <rect x="1" y="1" width="94" height="62" rx="5" fill="url(#fond)"/>
  <!-- Fines ondulations de sécurité -->
  <g clip-path="url(#carte)" fill="none" stroke="#B9D3A8" stroke-width=".5" opacity=".8">
    <path d="M-4 22c8-4 16 4 24 0s16 4 24 0 16 4 24 0 16 4 24 0 16 4 24 0"/>
    <path d="M-4 30c8-4 16 4 24 0s16 4 24 0 16 4 24 0 16 4 24 0 16 4 24 0"/>
    <path d="M-4 38c8-4 16 4 24 0s16 4 24 0 16 4 24 0 16 4 24 0 16 4 24 0"/>
    <path d="M-4 46c8-4 16 4 24 0s16 4 24 0 16 4 24 0 16 4 24 0 16 4 24 0"/>
  </g>
  <path d="M1 50h94v8a5 5 0 0 1-5 5H6a5 5 0 0 1-5-5z" fill="#C7E0BA" opacity=".85"/>
  <rect x="1" y="1" width="94" height="62" rx="5" fill="none" stroke="#8DB47E" stroke-width="1.2"/>
  <!-- Drapeau européen -->
  <rect x="6" y="6" width="18" height="12" rx="1" fill="#1F4E9E"/>
  <g fill="#F2D21B">
    <circle cx="15" cy="7.8" r=".8"/><circle cx="18.6" cy="8.8" r=".8"/><circle cx="20.2" cy="12" r=".8"/><circle cx="18.6" cy="15.2" r=".8"/>
    <circle cx="15" cy="16.2" r=".8"/><circle cx="11.4" cy="15.2" r=".8"/><circle cx="9.8" cy="12" r=".8"/><circle cx="11.4" cy="8.8" r=".8"/>
  </g>
  <text x="15" y="13.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="3.8" font-weight="700" fill="#FFFFFF">EU</text>
  <text x="28" y="14" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#1F4E9E">VISA</text>
  <text x="28" y="21" font-family="Arial, sans-serif" font-size="5" letter-spacing=".4" fill="#1F4E9E">FRANCE</text>
  <text x="88" y="14" text-anchor="end" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#2C5E2A">D</text>
  <!-- Photo : silhouette anonyme -->
  <rect x="6" y="24" width="18" height="22" rx="1.5" fill="#FFFFFF" stroke="#8DB47E" stroke-width=".8"/>
  <circle cx="15" cy="32" r="4" fill="#9AA6AE"/>
  <path d="M8 46c1-6 4-8 7-8s6 2 7 8z" fill="#9AA6AE"/>
  <!-- Lignes de texte -->
  <g stroke="#7E9A74" stroke-width="1.6" stroke-linecap="round">
    <path d="M30 28h30M30 34h22M30 40h34M66 28h20M58 34h28"/>
  </g>
  <!-- Pastille brillante (hologramme), purement décorative -->
  <circle cx="38" cy="47" r="5.5" fill="url(#holo)" stroke="#C9B57A" stroke-width=".5"/>
  <circle cx="36.3" cy="45.3" r="1.6" fill="#FFFFFF" opacity=".8"/>
  <!-- Signature : simple trait décoratif -->
  <path d="M50 49c2-6 4-7 4-3s-1 6 1 3 3-8 5-6-1 7 2 5 4-4 6-3" fill="none" stroke="#1B1B1B" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tampon décoratif, sans texte ni référence officielle -->
  <g transform="rotate(-14 82 44)" fill="none" stroke="#5B6FA3" opacity=".75">
    <circle cx="82" cy="44" r="9" stroke-width=".9"/>
    <circle cx="82" cy="44" r="6.6" stroke-width=".5" stroke-dasharray="1.2 1"/>
    <path d="M77.5 44h9M82 40.5l1 2h2.2l-1.8 1.4.7 2.1-2.1-1.3-2.1 1.3.7-2.1-1.8-1.4h2.2z" stroke-width=".5"/>
  </g>
  <path d="M8 56h80" stroke="#A9C79D" stroke-width="1.2" stroke-dasharray="3 2"/>
</svg>
