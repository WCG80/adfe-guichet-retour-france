<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" role="img" aria-labelledby="t">
  <title id="t">Carte de séjour</title>
  <!-- Carte de séjour simplifiée et anonyme : bandeau « TITRE DE SÉJOUR », silhouette, lignes de texte, emblème estompé, lignes de lecture -->
  <defs>
    <!-- Fond dégradé comme la vraie carte : rose à gauche, bleu pâle au centre, rose à droite -->
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6CFDB"/>
      <stop offset=".45" stop-color="#D4E3F1"/>
      <stop offset=".7" stop-color="#E9DDEB"/>
      <stop offset="1" stop-color="#F6CFDB"/>
    </linearGradient>
    <linearGradient id="bandeau" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C46A9A"/>
      <stop offset=".45" stop-color="#5A63B8"/>
      <stop offset=".8" stop-color="#7E8FD0"/>
      <stop offset="1" stop-color="#F0D3E0"/>
    </linearGradient>
    <clipPath id="carte"><rect x="1" y="1" width="94" height="62" rx="5"/></clipPath>
  </defs>
  <rect x="1" y="1" width="94" height="62" rx="5" fill="url(#fond)"/>
  <g clip-path="url(#carte)">
    <!-- Bandeau du haut -->
    <rect x="0" y="0" width="96" height="12" fill="url(#bandeau)"/>
    <path d="M16 10l5-7h9l-5 7z" fill="#7A2A5E"/>
    <!-- Bas de carte clair, avec les lignes de lecture -->
    <rect x="0" y="48" width="96" height="16" fill="#FFFFFF" opacity=".55"/>
  </g>
  <rect x="1" y="1" width="94" height="62" rx="5" fill="none" stroke="#C9B3C4" stroke-width="1.2"/>
  <text x="58" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="700" letter-spacing=".3" fill="#FFFFFF">TITRE DE SÉJOUR</text>
  <!-- Photo : silhouette anonyme -->
  <circle cx="14" cy="26" r="5" fill="none" stroke="#8C8C8C" stroke-width="1"/>
  <path d="M6 44l3-10h10l3 10" fill="none" stroke="#8C8C8C" stroke-width="1"/>
  <!-- Lignes de texte -->
  <g stroke="#7C7FA6" stroke-width="1.4" stroke-linecap="round">
    <path d="M28 17h28M28 22h16M28 26h20M28 30h14M50 30h10M28 34h18M28 38h22"/>
  </g>
  <!-- Emblème estompé -->
  <g fill="none" stroke="#C99AB3" stroke-width=".7" opacity=".9">
    <circle cx="80" cy="29" r="8"/>
    <path d="M80 21v16M75 25c-2 3-2 6 0 9M85 25c2 3 2 6 0 9"/>
  </g>
  <!-- Lignes de lecture automatique -->
  <text x="88" y="55" text-anchor="end" font-family="Courier New, monospace" font-size="4.6" fill="#333333">&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
  <text x="88" y="60" text-anchor="end" font-family="Courier New, monospace" font-size="4.6" fill="#333333">&lt;&lt;&lt;&lt;&lt;&lt;</text>
</svg>
